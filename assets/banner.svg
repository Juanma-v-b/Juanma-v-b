<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="900" viewBox="0 0 1720 900" role="img" aria-labelledby="title desc">
  <title id="title">Juanma Vizcaíno — Developer profile banner</title>
  <desc id="desc">Dark developer banner with binary message WHO AM I, name, frontend and backend description, and GitHub link.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset=".55" stop-color="#000000"/>
      <stop offset="1" stop-color="#030406"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="45%" r="60%">
      <stop offset="0" stop-color="#1a2240" stop-opacity=".55"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b91a5" stop-opacity=".05"/>
      <stop offset=".5" stop-color="#8b91a5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#8b91a5" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="geoStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".9"/>
      <stop offset=".5" stop-color="#7c8cff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5b6bd6" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity=".9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="inside">
      <rect x="24" y="24" width="1672" height="852" rx="2"/>
    </clipPath>
  </defs>

  <!-- Marco exterior simétrico (14px por los 4 lados) -->
  <rect width="1720" height="900" fill="#000000"/>
  <rect x="14" y="14" width="1692" height="872" fill="#0a0a0a"/>

  <g clip-path="url(#inside)">
    <rect x="24" y="24" width="1672" height="852" fill="url(#bg)"/>
    <rect x="24" y="24" width="1672" height="852" fill="url(#glow)"/>

    <!-- ===== Composición geométrica (perfectamente centrada en su mitad) ===== -->
    <g opacity=".9" transform="translate(1420, 390) scale(1.5) translate(-1500, -370)">
      <g stroke="#2a3350" stroke-width="1" opacity=".32">
        <path d="M1300 250 L1560 120 L1820 250 L1560 380 Z" fill="none"/>
        <path d="M1300 330 L1560 200 L1820 330 L1560 460 Z" fill="none"/>
        <path d="M1300 410 L1560 280 L1820 410 L1560 540 Z" fill="none"/>
        <path d="M1300 490 L1560 360 L1820 490 L1560 620 Z" fill="none"/>
      </g>
      <g transform="translate(1560 390)">
        <polygon points="0,-150 130,-75 130,75 0,150 -130,75 -130,-75"
                 fill="none" stroke="url(#geoStroke)" stroke-width="2.5"/>
        <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55"
                 fill="none" stroke="#7c8cff" stroke-opacity=".35" stroke-width="1.5"/>
        <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
                 fill="#0d1420" fill-opacity=".6" stroke="#a78bfa" stroke-opacity=".6" stroke-width="1.5"/>
      </g>
      <g fill="none" stroke="#7c8cff" stroke-opacity=".5" stroke-width="1.6">
        <polygon points="1420,250 1465,275 1465,325 1420,350 1375,325 1375,275"/>
        <polygon points="1700,250 1745,275 1745,325 1700,350 1655,325 1655,275"/>
        <polygon points="1420,530 1465,555 1465,605 1420,630 1375,605 1375,555"/>
        <polygon points="1700,530 1745,555 1745,605 1700,630 1655,605 1655,555"/>
      </g>
      <g stroke="url(#geoStroke)" stroke-width="1.4" fill="none" opacity=".65">
        <line x1="1465" y1="300" x2="1470" y2="315"/>
        <line x1="1655" y1="300" x2="1650" y2="315"/>
        <line x1="1465" y1="580" x2="1470" y2="465"/>
        <line x1="1655" y1="580" x2="1650" y2="465"/>
        <line x1="1560" y1="240" x2="1560" y2="200"/>
        <line x1="1560" y1="540" x2="1560" y2="580"/>
      </g>
      <g>
        <circle cx="1560" cy="390" r="26" fill="url(#nodeGlow)" filter="url(#nodeBlur)"/>
        <circle cx="1560" cy="390" r="6" fill="#c4b5fd"/>
        <circle cx="1420" cy="300" r="4" fill="#a78bfa"/>
        <circle cx="1700" cy="300" r="4" fill="#a78bfa"/>
        <circle cx="1420" cy="580" r="4" fill="#a78bfa"/>
        <circle cx="1700" cy="580" r="4" fill="#a78bfa"/>
      </g>
      <g fill="#a78bfa" fill-opacity=".75">
        <polygon points="1560,150 1570,165 1550,165"/>
        <polygon points="1560,630 1570,615 1550,615"/>
      </g>
    </g>

    <!-- GitHub mark -->
    <g transform="translate(105 60) scale(1.3)" fill="#f4f5f8">
      <path d="M20 0C8.95 0 0 8.95 0 20c0 8.84 5.73 16.34 13.68 18.99 1 .18 1.37-.43 1.37-.96v-3.37c-5.56 1.21-6.74-2.36-6.74-2.36-.91-2.31-2.22-2.93-2.22-2.93-1.82-1.24.14-1.22.14-1.22 2.01.14 3.07 2.06 3.07 2.06 1.79 3.06 4.69 2.18 5.83 1.67.18-1.3.7-2.18 1.27-2.68-4.44-.5-9.11-2.22-9.11-9.88 0-2.18.78-3.96 2.06-5.36-.21-.51-.89-2.54.2-5.29 0 0 1.68-.54 5.5 2.05a19.1 19.1 0 0 1 10.01 0c3.82-2.59 5.49-2.05 5.49-2.05 1.1 2.75.41 4.78.2 5.29 1.29 1.4 2.06 3.18 2.06 5.36 0 7.68-4.68 9.37-9.14 9.87.72.62 1.36 1.84 1.36 3.71v5.51c0 .53.36 1.15 1.38.95A20.02 20.02 0 0 0 40 20C40 8.95 31.05 0 20 0Z"/>
    </g>

    <!-- Badge "DEVELOPER PROFILE" (estilo píldora gris) -->
    <g transform="translate(1360, 52)">
      <rect width="265" height="55" rx="29" fill="#000000" stroke="#ffffff7a" stroke-width="1.5"/>
      <text x="134" y="33" fill="#ffffffc7" font-family="Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="2" text-anchor="middle">DEVELOPER PROFILE</text>
    </g>

 
    <!-- Nombre -->
    <text x="105" y="400" fill="#f5f6f8" font-family="Manrope, Inter, Arial, sans-serif" font-size="140" font-weight="750" letter-spacing="-4.5">Juanma Vizcaíno</text>

    <!-- Frases centrales refinadas -->
    <g font-family="Manrope, Inter, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">
      <text x="107" y="520" fill="url(#purple)">Building interfaces.</text>
      <text x="107" y="600" fill="url(#purple)">Connecting systems.</text>
    </g>

    <!-- Divisor y Footer Text -->
  
    <text x="107" y="804" fill="#5c6270" font-family="Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="3">FRONTEND DEVELOPMENT · BACKEND INTEGRATION</text>
  </g>
</svg>